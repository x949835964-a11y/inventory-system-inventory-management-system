{% extends "base.html" %}

{% block title %}{{ self.error_title() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <i class="bi bi-{% block error_icon %}exclamation-triangle{% endblock %} display-1 text-body-secondary"></i>
  <p class="display-4 fw-bold mt-3 mb-1">{% block error_code %}{% endblock %}</p>
  <h1 class="h4">{% block error_title %}{% endblock %}</h1>
  <p class="text-body-secondary mb-4">{% block error_message %}{% endblock %}</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Volver al inicio</a>
</div>
{% endblock %}
